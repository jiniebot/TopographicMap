# Tile-serving location blocks for the production VPS. This is an nginx
# *snippet*, not a full site config - it gets included from inside the
# existing HTTPS server{} block documented in
# JinieBotInterface/Docs/DEPLOYMENT_GUIDE.md (the one that already has
# `location / { proxy_pass http://localhost:3000; }`).
#
# One-time setup on the VPS:
#   sudo cp jiniebot-tiles.conf /etc/nginx/snippets/jiniebot-tiles.conf
#   sudo mkdir -p /var/www/jiniebot-tiles/{releases,current}
# Then add this single line inside the existing `server { listen 443 ssl ... }`
# block, alongside the existing `location /` block:
#   include /etc/nginx/snippets/jiniebot-tiles.conf;
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Tiles are served entirely by nginx - they never touch the Node process.
#
# URLs include the version segment (/tiles/<mapId>/<version>/...), served
# straight out of releases/ - NOT out of current/. That's deliberate: the
# `immutable, max-age=1y` header below tells browsers to never revalidate
# a cached tile, so the URL itself has to change whenever the underlying
# content does. If this pointed at current/ instead, flipping that
# symlink on a new deploy would silently do nothing for anyone with an
# already-cached tile - same URL, browser never re-fetches, "immutable"
# would just be lying. `current/<mapId>` still exists (maintained by
# deploy/sync-tiles.sh and deploy/rollback-tile.sh) but its only consumer
# is regen-manifest.sh, which reads it to report the live version to
# clients via manifest.json - the client then builds versioned tile URLs
# from that.
# The color-editor's Save button (server.js's POST /api/map-render/styles/:mapId)
# rewrites styles/topographic-{light,dark}.json IN PLACE inside every
# existing version directory - a color edit does not bump the version.
# That file is therefore NOT immutable within a version the way tiles
# are, so it needs its own short-cache location, matched before the
# general regex below (nginx tries regex locations in the order they're
# declared, first match wins).
location ~ ^/tiles/[a-z0-9_-]+/[a-z0-9._-]+/styles/ {
    root /var/www/jiniebot-tiles/releases;
    rewrite ^/tiles/(.*)$ /$1 break;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
    try_files $uri =404;
}

# Everything else under a version dir (satellite PNGs, topographic MVT
# layers) - genuinely immutable, since a re-render always gets a new
# version string (see deploy/compute-content-hash.js / sync-tiles.sh).
location ~ ^/tiles/[a-z0-9_-]+/[a-z0-9._-]+/ {
    root /var/www/jiniebot-tiles/releases;
    rewrite ^/tiles/(.*)$ /$1 break;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    types {
        image/png png;
        application/x-protobuf pbf;
        application/json json;
    }
    gzip on;
    gzip_types application/x-protobuf application/json;
    try_files $uri =404;
}

# Short-lived cache - this is the one thing that changes on every deploy
# (points at whatever version is currently live per map), so it can't be
# immutable like the tiles themselves.
location = /tiles/manifest.json {
    alias /var/www/jiniebot-tiles/manifest.json;
    add_header Cache-Control "public, max-age=60" always;
}
