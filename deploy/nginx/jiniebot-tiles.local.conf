# Standalone local rehearsal of the production nginx topology - fronts
# BOTH the tile tree (via deploy/local-stage.sh's mirror of
# out/mapdraw/final) AND the JinieBotInterface dev server (proxied
# through, same as prod's `location /` block), so relative "/tiles/..."
# URLs in client code behave identically here and in prod - no dev/prod
# base-URL branching needed anywhere in JinieBotInterface's JS.
#
# One-time setup (WSL, run once):
#   wsl --install                       # if WSL2 isn't installed yet
#   sudo apt update && sudo apt install -y nginx
#
# Each time you want to test:
#   1. In boundingboxes: bash deploy/local-stage.sh
#   2. Make sure JinieBotInterface is actually running on :3000 - either
#      `npm run dev`, or `pm2 restart JinieBotInterface` if you're running
#      it under PM2 locally too (check `pm2 list` / `pm2 logs`).
#   3. In boundingboxes:
#        sudo nginx -c "$(pwd)/deploy/nginx/jiniebot-tiles.local.conf" -p "$(pwd)/deploy"
#      (if it's already running from a previous session, use `-s reload`
#      instead of starting a second instance - `bind() ... Address already
#      in use` means it's already up, not broken.)
#   4. Browse to http://localhost:8080/ instead of :3000 - the public map
#      page there will resolve /tiles/... through this local nginx.
#   5. To stop:  sudo nginx -c "$(pwd)/deploy/nginx/jiniebot-tiles.local.conf" -p "$(pwd)/deploy" -s stop

worker_processes 1;
error_log local-stage/nginx-error.log warn;
pid local-stage/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log local-stage/nginx-access.log;
    client_max_body_size 10M;

    server {
        listen 8080;
        server_name localhost;

        # Mirrors deploy/nginx/jiniebot-tiles.conf exactly (URLs include
        # the version segment and are served out of releases/, not
        # current/ - see that file's comment for why immutable caching
        # requires this). styles/ JSON gets its own short-cache location
        # since color edits rewrite it in place without a version bump.
        location ~ ^/tiles/[a-z0-9_-]+/[a-z0-9._-]+/styles/ {
            root local-stage/releases;
            rewrite ^/tiles/(.*)$ /$1 break;
            add_header Cache-Control "public, max-age=300" always;
            add_header Access-Control-Allow-Origin "*" always;
            default_type application/json;
            try_files $uri =404;
        }

        location ~ ^/tiles/[a-z0-9_-]+/[a-z0-9._-]+/ {
            root local-stage/releases;
            rewrite ^/tiles/(.*)$ /$1 break;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            types {
                image/png png;
                application/x-protobuf pbf;
                application/json json;
            }
            gzip on;
            gzip_types application/x-protobuf application/json;
            try_files $uri =404;
        }

        location = /tiles/manifest.json {
            alias local-stage/manifest.json;
            add_header Cache-Control "public, max-age=60" always;
        }

        # Everything else (the dashboard app itself) - same proxy target
        # as prod's nginx config conceptually, just no TLS/security
        # headers (local testing only) and pointed at the Windows host's
        # IP rather than "localhost". WSL2's default (non-mirrored)
        # networking means plain localhost from inside WSL means WSL
        # itself, not the Windows side where JinieBotInterface's PM2
        # process actually listens - only Windows->WSL localhost is
        # automatic, not the reverse. This IP is WSL's default-gateway
        # address (`ip route show | grep default | awk '{print $3}'`),
        # which is usually stable across reboots but not guaranteed -
        # re-run that command and update this line if the proxy ever
        # starts 502ing again after a WSL/Windows restart. (Prod itself
        # never hits this: nginx and Node run on the same box there.)
        location / {
            proxy_pass http://192.168.48.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
